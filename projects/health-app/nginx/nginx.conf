upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name desktop-468burf.tail2cd00c.ts.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name desktop-468burf.tail2cd00c.ts.net;

    ssl_certificate     /etc/nginx/certs/desktop-468burf.tail2cd00c.ts.net.crt;
    ssl_certificate_key /etc/nginx/certs/desktop-468burf.tail2cd00c.ts.net.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Backend API routes
    location ~ ^/(workout|inbody|nutrition|english|health)(/|$) {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (including /api/auth/...)
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
